[package]
name = "cargo-propagate-features"
description = "Cargo subcommand to automatically propagate workspace crate features to dependencies"
version = "0.0.1"
edition = "2024"
license-file = "LICENSE"
authors = ["Jacobus Geluk <jacobus@dataroad.com>"]
repository = "https://github.com/agnos-ai/cargo-propagate-features"
documentation = "https://docs.rs/cargo-propagate-features"
homepage = "https://github.com/agnos-ai/cargo-propagate-features"
rust-version = "1.92.0"
readme = "README.md"
keywords = ["cargo", "features", "workspace", "cli"]
categories = ["command-line-utilities", "development-tools"]
publish = true

exclude = [
    ".cargo/",
    ".cargo-husky/",
    ".clippy.toml",
    ".cursor/",
    ".github/",
    ".gitignore",
    ".rust-toolchain.toml",
    ".vscode/",
    "cog.toml",
    "rustfmt.toml",
    "scripts/",
]

[[bin]]
name = "cargo-propagate-features"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.100"
atty = "0.2.14"
cargo_metadata = "0.23.1"
clap = { version = "4.5.53", default-features = false, features = [
    "derive",
    "env",
    "std",
] }
indicatif = "0.18.3"
serde = { version = "1", features = ["derive"] }
toml_edit = "=0.23.9"

[build-dependencies]
cargo-version-info = "0.0.3"

[package.metadata.binstall]
pkg-url = "https://github.com/agnos-ai/cargo-propagate-features/releases/download/v{{version}}/cargo-propagate-features-{{target}}-{{version}}.tar.gz"
pkg-fmt = "tar.gz"
